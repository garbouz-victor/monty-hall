spring:
  application:
    name: joy-hub-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/joyhub}
    username: ${POSTGRES_USER:joyhub}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 1
      connection-timeout: 3000
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

joyhub:
  visitor-cookie:
    secure: ${VISITOR_COOKIE_SECURE:true}
  abuse:
    max-open-games: ${MAX_OPEN_GAMES_PER_VISITOR:20}
    open-game-window: ${OPEN_GAME_WINDOW:PT24H}
  competition:
    daily-attempt-limit: ${COMPETITION_DAILY_ATTEMPT_LIMIT:5}
    cookie:
      name: ${COMPETITION_COOKIE_NAME:__Host-joyhub_competition}
      secure: ${COMPETITION_COOKIE_SECURE:true}
  test:
    random-sequence: ${JOYHUB_TEST_RANDOM_SEQUENCE:0,0,1}

logging:
  structured:
    format:
      console: ecs
