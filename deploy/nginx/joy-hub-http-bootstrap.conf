# Temporary HTTP-only configuration used before the first Certbot run.
server {
    listen 80;
    listen [::]:80;
    server_name joy-hub.ru www.joy-hub.ru;

    root /var/www/joy-hub;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

