# Install as /etc/nginx/sites-available/joy-hub.conf after Certbot has created
# /etc/letsencrypt/live/joy-hub.ru/. These zone declarations belong to nginx's
# http context; sites-enabled is normally included from that context.
limit_req_zone $binary_remote_addr zone=joyhub_game_create:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=joyhub_stats:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=joyhub_api:10m rate=20r/s;
map "$request_method:$uri" $joyhub_competition_write_key {
    default "";
    ~^(PUT:/api/v1/competition/profile|POST:/api/v1/competition/runs(/[0-9a-fA-F-]+/(rounds|abandon))?)$ $binary_remote_addr;
}
limit_req_zone $joyhub_competition_write_key zone=joyhub_competition_write:10m rate=5r/s;

upstream joyhub_backend {
    server 10.88.88.2:8080 max_fails=2 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name joy-hub.ru www.joy-hub.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/joy-hub;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://joy-hub.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.joy-hub.ru;

    ssl_certificate /etc/letsencrypt/live/joy-hub.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/joy-hub.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include snippets/joy-hub-security-headers.conf;

    return 301 https://joy-hub.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name joy-hub.ru;

    root /var/www/joy-hub;
    index index.html;
    client_max_body_size 16k;

    ssl_certificate /etc/letsencrypt/live/joy-hub.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/joy-hub.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include snippets/joy-hub-security-headers.conf;

    access_log /var/log/nginx/joy-hub.access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/joy-hub.error.log warn;

    location = /index.html {
        include snippets/joy-hub-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location /assets/ {
        include snippets/joy-hub-security-headers.conf;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /api/v1/games {
        limit_req zone=joyhub_game_create burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://joyhub_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_unavailable;
    }

    location = /api/v1/stats {
        limit_req zone=joyhub_stats burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://joyhub_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_unavailable;
    }

    location /api/ {
        limit_req zone=joyhub_api burst=20 nodelay;
        limit_req zone=joyhub_competition_write burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://joyhub_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @backend_unavailable;
    }

    location @backend_unavailable {
        default_type application/problem+json;
        include snippets/joy-hub-security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 503 '{"title":"Игровой сервер временно недоступен","status":503,"code":"BACKEND_UNAVAILABLE"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
